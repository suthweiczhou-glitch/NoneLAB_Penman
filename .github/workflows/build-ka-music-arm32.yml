name: Build KA Music v2.6.0 ARM32

on:
  push:
    branches:
      - ka-music-arm32-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Install Android API 36
        shell: bash
        run: |
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Fetch KA Music v2.6.0
        shell: bash
        run: |
          git clone --depth 1 --branch v2.6.0 https://github.com/umr-xiaomai/kgka_Music_hl.git ka-music

      - name: Patch for Xiaomi Mi 3 ARM32
        shell: bash
        working-directory: ka-music
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          old = 'abiFilters.add("arm64-v8a")'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f"Expected 2 arm64 ABI filters, found {count}")
          s = s.replace(old, 'abiFilters.add("armeabi-v7a")')
          if 'compileSdk = 37' not in s:
              raise SystemExit("Expected compileSdk = 37")
          s = s.replace('compileSdk = 37', 'compileSdk = 36')
          p.write_text(s)
          print("Patched ABI filters:", s.count('abiFilters.add("armeabi-v7a")'))
          print("Patched compileSdk to 36")
          PY

      - name: Resolve dependencies
        shell: bash
        working-directory: ka-music
        run: |
          flutter --version
          dart --version
          flutter pub get

      - name: Build ARM32 release APK
        shell: bash
        working-directory: ka-music
        run: |
          flutter build apk --release --target-platform android-arm --split-per-abi
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../kgmusic_v2.6.0_mi3_arm32.apk

      - name: Verify APK contains ARM32 native libraries
        shell: bash
        run: |
          set -e
          unzip -l kgmusic_v2.6.0_mi3_arm32.apk | tee apk_contents.txt
          if unzip -l kgmusic_v2.6.0_mi3_arm32.apk | grep -q "lib/arm64-v8a/"; then
            echo "Unexpected arm64-v8a library found"
            exit 1
          fi
          if unzip -l kgmusic_v2.6.0_mi3_arm32.apk | grep -q "lib/armeabi-v7a/"; then
            echo "Verified armeabi-v7a native libraries"
          else
            echo "No native libraries present under lib/armeabi-v7a; continuing because a pure-Dart/plugin-light APK can still be ARM32 compatible."
          fi
          sha256sum kgmusic_v2.6.0_mi3_arm32.apk | tee kgmusic_v2.6.0_mi3_arm32.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kgmusic-v2.6.0-mi3-arm32
          path: |
            kgmusic_v2.6.0_mi3_arm32.apk
            kgmusic_v2.6.0_mi3_arm32.sha256
          if-no-files-found: error
          retention-days: 7
